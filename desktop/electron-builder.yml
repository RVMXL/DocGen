appId: ru.rvmxl.docgen
productName: DocGen
copyright: All rights reserved. This code is for viewing purposes only.

directories:
  output: ../release-dist
  buildResources: build

# payload: main-процесс + встроенный Next.js standalone (app/) — собирается
# на каждом раннере нативно, поэтому Prisma-движки совпадают с платформой
files:
  - main.cjs
  - preload.cjs
  - package.json
  - app/**/*

asar: false

extraResources:
  - from: resources/db
    to: db-template
    filter: ["**/*"]

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: DocGen-${version}-win64-setup.exe
  shortcutName: DocGen
  uninstallDisplayName: DocGen

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  identity: null
  target:
    - target: dmg
      arch: [arm64]

dmg:
  artifactName: DocGen-${version}-mac-arm64.dmg
  title: DocGen ${version}

linux:
  icon: build/icon.png
  category: Office
  maintainer: RVMXL
  target:
    - AppImage
    - deb
  artifactName: DocGen-${version}-linux-x64.${ext}
