# CI: сборка приложения на каждый пуш в main и на PR — зелёный билд = валидный код.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Зависимости
        run: bun install --frozen-lockfile

      - name: Схема БД
        env:
          DATABASE_URL: "file:${{ github.workspace }}/db/custom.db"
        run: bunx prisma generate && bunx prisma db push --skip-generate

      - name: Каталог шаблонов (seed)
        env:
          DATABASE_URL: "file:${{ github.workspace }}/db/custom.db"
        run: bun prisma/seed.ts

      - name: next build
        env:
          DATABASE_URL: "file:${{ github.workspace }}/db/custom.db"
        run: bunx next build

      - name: Смоук API (каталог отдаёт шаблоны)
        env:
          DATABASE_URL: "file:${{ github.workspace }}/db/custom.db"
        run: |
          set -euo pipefail
          bunx next start -p 3999 &
          SERVER_PID=$!
          OK=0
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:3999/api/catalog?country=RU" > /tmp/catalog.json 2>/dev/null; then OK=1; break; fi
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null || true
          test "$OK" = 1 || { echo "✗ /api/catalog недоступен"; exit 1; }
          COUNT=$(node -e "const d=require('/tmp/catalog.json'); let n=0; for (const g of d.groups||[]) for (const s of g.subgroups||[]) n+=(s.templates||[]).length; if(!n) process.exit(1); console.log(n)")
          echo "Шаблонов в каталоге (ru): $COUNT"
