# DocGen CI: статическая сборка + проверка целостности каталога шаблонов.
# Приложение автономное (output: export) — сервер и БД не нужны.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Зависимости
        run: bun install --frozen-lockfile

      - name: Целостность каталога (22 страны, уникальные slug, плейсхолдеры)
        run: bun tools/check-data.ts

      - name: "Статическая сборка (output: export)"
        run: bunx next build

      - name: Проверка результата
        run: |
          test -f out/index.html || { echo "✗ нет out/index.html"; exit 1; }
          test -f out/fonts/LiberationSerif-Regular.ttf || { echo "✗ нет шрифтов"; exit 1; }
          echo "✓ out/ готов"
