# DocGen release: тег v* → сборка ВСЕХ платформ и единый GitHub Release.
#
# Приложение САМОДОСТАТОЧНОЕ (документы генерируются на устройстве, сервера нет):
#   - web-package:  статический сайт (out/) в zip — развернуть на любом хостинге;
#   - desktop:      Windows/Linux (matrix) — Electron со статикой внутри;
#   - desktop-mac:  macOS — ОТДЕЛЬНАЯ джоба: mac-раннеры часто в очереди,
#                   публикация релиза из-за них НЕ блокируется;
#   - android:      подписанный APK (ключ из Secrets, SHA-пин, сверка сертификата).
#
# Примечания к релизу = секция версии из CHANGELOG.md: тег v0.6.0 → «## [0.6.0]».
# Гейт проверяет наличие секции ДО сборок; затем секция склеивается с описанием
# артефактов и публикуется как тело релиза (generate_release_notes добавит
# «Full Changelog» в конец автоматически).
#
# iOS-сборки нет: публикация требует Apple Developer Program и подписи Apple (README → «Скачать»).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ── общая статическая сборка ────────────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Зависимости
        run: bun install --frozen-lockfile

      - name: "Гейт: версия в package.json = тегу"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "✗ тег '$TAG' не vX.Y.Z"; exit 1 ;; esac
          VER="${TAG#v}"
          PKGVER=$(node -p "require('./package.json').version")
          test "$PKGVER" = "$VER" || { echo "✗ версия package.json ($PKGVER) != тегу ($VER) — бампни версию и переметь тег"; exit 1; }

      - name: "Гейт: CHANGELOG.md содержит секцию версии"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \[$VER\]" CHANGELOG.md || {
            echo "✗ в CHANGELOG.md нет секции '## [$VER]' — примечания релиза берутся из неё (см. политику в шапке CHANGELOG.md)"; exit 1;
          }
          echo "✓ секция [$VER] найдена"

      - name: Целостность каталога
        run: bun tools/check-data.ts

      - name: "Статическая сборка (output: export)"
        run: bunx next build

      - name: Кэш статики для остальных джоб
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out
          key: docgen-static-${{ github.sha }}

  # ── web: zip для развёртывания на любом статическом хостинге ───────────────
  web-package:
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Восстановить статическую сборку
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out
          key: docgen-static-${{ github.sha }}

      - name: zip + tar.gz
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          cd out
          zip -qr "../DocGen-${VER}-web.zip" .
          tar -czf "../DocGen-${VER}-web.tar.gz" .
          cd ..
          sha256sum DocGen-${VER}-web.* > SHA256SUMS-web.txt
          cat SHA256SUMS-web.txt

      - name: Артефакт
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: web-package
          path: |
            DocGen-*-web.zip
            DocGen-*-web.tar.gz
            SHA256SUMS-web.txt
          if-no-files-found: error

  # ── десктоп: Electron (Windows / Linux) ────────────────────────────────────
  desktop:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile

      - name: Статическая сборка
        run: bunx next build

      - name: Payload Electron-приложения
        run: node tools/prepare-desktop.mjs

      - name: electron-builder
        working-directory: desktop
        run: |
          npm install --no-fund --no-audit
          npx electron-builder --${{ matrix.platform }} --publish never

      - name: Артефакт
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release-dist/*.exe
            release-dist/*.AppImage
            release-dist/*.deb
          if-no-files-found: error

  # ── десктоп macOS: отдельная джоба, НЕ блокирует публикацию релиза ─────────
  desktop-mac:
    needs: build-web
    runs-on: mac-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile

      - name: Статическая сборка
        run: bunx next build

      - name: Payload Electron-приложения
        run: node tools/prepare-desktop.mjs

      - name: electron-builder
        working-directory: desktop
        run: |
          npm install --no-fund --no-audit
          npx electron-builder --mac --publish never

      - name: Артефакт
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-mac
          path: |
            release-dist/*.dmg
          if-no-files-found: error

  # ── Android: подписанный APK (ключ из Secrets, SHA-пин) ────────────────────
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Зависимости
        run: bun install --frozen-lockfile

      # ── КЛЮЧ ПОДПИСИ: только из Secrets, SHA-пин. Ключ НИКОГДА не генерируем
      # заново: новый ключ = невозможно обновиться поверх установленного APK.
      - name: Ключ подписи из Secrets + сверка SHA-256 пина
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_SHA256: ef6493931e2e8b2adc1300aed68d95a6c2ed2dcc81a4c1d57c4e5fcd0beca1f5
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "✗ секреты подписи не заданы: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/docgen-upload.jks"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/docgen-upload.jks" | cut -d' ' -f1)
          echo "SHA-256 ключа из секрета: $ACTUAL"
          if [ "$ACTUAL" != "$KEYSTORE_SHA256" ]; then
            echo "✗ SHA-256 ключа НЕ совпал с мастер-пином: секрет подменён или испорчен. Сборка остановлена."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/docgen-upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/keystore.properties

      - name: "Версия APK = тегу (versionName), versionCode = номеру прогона (монотонно)"
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          CODE="${GITHUB_RUN_NUMBER}"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"$VER\"/" android/app/build.gradle
          echo "versionCode=$CODE, versionName=$VER"

      - name: Статическая сборка
        run: bunx next build

      - name: capacitor sync (out/ → android assets, приложение офлайн)
        run: bunx cap sync android

      - name: Сборка подписанного APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: "Проверка подписи: сертификат должен совпадать со стабильным"
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "✗ APK не собран"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          CERT_SHA=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/certs.txt | head -1)
          echo "Сертификат подписи (SHA-256): $CERT_SHA"
          EXPECTED="9fb027a8a4eeda2813af6a74261bb087c09bc73bb0af2bc050c15fedb61b1f46"
          if [ "$(echo "$CERT_SHA" | tr 'A-F' 'a-f')" != "$EXPECTED" ]; then
            echo "✗ сертификат APK ($CERT_SHA) не совпал с заявленным в README ($EXPECTED)"
            exit 1
          fi

      - name: Переименовать артефакт
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "DocGen-${VER}-android.apk"
          sha256sum "DocGen-${VER}-android.apk"

      - name: Артефакт
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-apk
          path: DocGen-*-android.apk
          if-no-files-found: error

  # ── публикация единого релиза (БЕЗ ожидания macOS) ─────────────────────────
  release:
    needs: [web-package, desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Извлечь секцию версии из CHANGELOG.md
        env:
          VER: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${VER#v}"
          python3 - <<'PY' > release-notes.md
          import os, re, pathlib, sys

          ver = os.environ["VER"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"(?ms)^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text)
          if not m:
              sys.exit(f"✗ в CHANGELOG.md нет секции [{ver}]")
          section = m.group(1).strip("\n")

          blurb = """
          Самодостаточные сборки для всех платформ: интернет и сервер НЕ нужны,
          документы генерируются прямо на устройстве.

          **Windows / Linux / macOS** — настольные приложения (Electron).
          **Android** — приложение (APK), работает полностью офлайн.
          **Web** — статический сайт: распакуйте и разверните на любом хостинге
          (nginx, Apache, GitHub Pages — см. README → «Развёртывание web-версии»).

          Контрольные суммы SHA-256 — в файле `SHA256SUMS.txt` в составе релиза.
          Android подписан стабильным ключом: SHA-256 сертификата — в README (раздел «Android»).

          Сборка macOS добавляется в релиз отдельной джобой чуть позже —
          mac-раннеры нередко стоят в очереди GitHub.

          iOS-сборки нет: публикация требует аккаунта Apple Developer Program и подписи Apple (см. README → «Скачать»).
          """

          body = section + "\n\n---\n\n" + blurb.strip("\n") + "\n"
          pathlib.Path("release-notes.md").write_text(body, encoding="utf-8")
          print(f"✓ release-notes.md: секция [{ver}] + описание артефактов")
          PY

      - name: Скачать все артефакты
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum DocGen-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Создать релиз
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "DocGen ${{ github.ref_name }}"
          prerelease: true
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/**

  # ── macOS: добавить артефакты в уже опубликованный релиз ───────────────────
  mac-upload:
    needs: [release, desktop-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Скачать mac-артефакт
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: mac
          name: desktop-mac

      - name: Загрузить в релиз
        run: |
          set -euo pipefail
          cd mac
          sha256sum *.dmg > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt
          gh release upload "${GITHUB_REF_NAME}" --clobber *.dmg SHA256SUMS-mac.txt
          echo "✓ macOS-сборка добавлена в релиз ${GITHUB_REF_NAME}"
